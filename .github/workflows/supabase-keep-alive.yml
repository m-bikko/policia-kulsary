# Резервный keep-alive для бесплатного проекта Supabase (пауза после 7 дней без активности).
# Основной пинг - Vercel Cron (vercel.json -> /api/keep-alive). Этот workflow бьёт в Supabase
# напрямую, поэтому работает, даже если сайт не задеплоен или Vercel Cron пропустил запуск.
#
# Нужны секреты репозитория (Settings -> Secrets and variables -> Actions):
#   SUPABASE_URL       - https://<project>.supabase.co
#   SUPABASE_ANON_KEY  - публичный ключ (anon или publishable), НЕ service role
#
# Важно: GitHub отключает расписания в публичных репозиториях, если в репо 60 дней
# не было коммитов, и присылает об этом письмо. Включить обратно - вкладка Actions,
# кнопка "Enable workflow".

name: Supabase keep-alive

on:
  schedule:
    - cron: "41 2 * * *"
    - cron: "41 14 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-keep-alive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping Supabase database
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_ANON_KEY:-}" ]; then
            echo "::error::Add repository secrets SUPABASE_URL and SUPABASE_ANON_KEY (Settings -> Secrets and variables -> Actions)"
            exit 1
          fi
          base="${SUPABASE_URL%/}"
          request() {
            curl --fail-with-body --silent --show-error \
              --retry 3 --retry-all-errors --retry-delay 15 --max-time 30 \
              -H "apikey: ${SUPABASE_ANON_KEY}" -H "Content-Type: application/json" "$@"
            echo
          }
          echo "keep_alive (write):"
          request -X POST "${base}/rest/v1/rpc/keep_alive" -d '{"p_source":"github-actions"}'
          echo "site_content (read):"
          request "${base}/rest/v1/site_content?select=id&id=eq.template"
